[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deskos-native"
version = "0.4.0"
description = "Native touch-first Raspberry Pi desktop information and monitoring console"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "psutil>=5.9,<8",
  "PyOpenGL>=3.1.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
deskos = "deskos.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
